<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>产品设计工作台</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 32px;
      height: 2200px;
      background: #f7f8fa;
      color: #20212a;
      font: 16px system-ui;
    }
    nav {
      display: flex;
      justify-content: space-between;
      color: #686879;
      font-size: 14px;
    }
    nav b {
      color: #6555b8;
    }
    h1 {
      margin-top: 72px;
      width: 640px;
      background: white;
      padding: 20px;
      border: 1px solid #e7e7ef;
      border-radius: 14px;
      font-size: 36px;
      letter-spacing: -1px;
    }
    p {
      color: #737381;
      line-height: 1.8;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 70px;
    }
    .card {
      background: white;
      border: 1px solid #e7e7ef;
      border-radius: 16px;
      padding: 24px;
    }
    .card span {
      font-size: 12px;
      color: #81789f;
    }
    .card h2 {
      font-size: 18px;
    }
    .card strong {
      display: block;
      font-size: 34px;
      margin-top: 30px;
    }
    .bar {
      height: 8px;
      border-radius: 5px;
      background: #eeeaf9;
      margin: 30px 0 12px;
    }
    .bar i {
      display: block;
      width: 65%;
      height: 8px;
      background: #a99bdb;
      border-radius: 5px;
    }
    footer {
      margin-top: 60px;
      font-size: 12px;
      color: #92929f;
    }
  </style>
  <nav><b>STUDIO / 设计工作台</b><span>概览　 项目　 设计规范</span></nav>
  <h1 id="subject">让每一处细节，都更进一步。</h1>
  <p>在真实页面上标记问题，把清晰的修改建议交给团队。</p>
  <div class="grid">
    <article class="card">
      <span>PROJECTS</span>
      <h2>进行中的项目</h2>
      <strong>12</strong>
      <div class="bar"><i></i></div>
      <p>让反馈跟随项目，一起推进。</p>
    </article>
    <article class="card">
      <span>REVIEW</span>
      <h2>待确认的设计</h2>
      <strong>08</strong>
      <div class="bar"><i style="width: 40%"></i></div>
      <p>从页面细节，找到下一步。</p>
    </article>
    <article class="card">
      <span>DELIVERY</span>
      <h2>本周完成</h2>
      <strong>24</strong>
      <div class="bar"><i style="width: 85%"></i></div>
      <p>每一次改进，都有迹可循。</p>
    </article>
  </div>
  <footer>MarkFix 演示项目 · 示例数据</footer>
</html>
