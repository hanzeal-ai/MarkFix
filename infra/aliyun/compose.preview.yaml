# Temporary HTTP demonstration environment; see docs/aliyun-deployment.md.
name: markfix-preview

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: markfix
      POSTGRES_DB: markfix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U markfix -d markfix']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ${API_IMAGE:?Set API_IMAGE}
    pull_policy: ${MARKFIX_MIGRATE_PULL_POLICY:-missing}
    profiles: [tools]
    env_file: ${MARKFIX_ENV_FILE:?Set MARKFIX_ENV_FILE}
    command:
      - node
      - node_modules/prisma/build/index.js
      - migrate
      - deploy
      - --schema
      - packages/database/prisma/schema.prisma
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${API_IMAGE:?Set API_IMAGE}
    restart: unless-stopped
    env_file: ${MARKFIX_ENV_FILE:?Set MARKFIX_ENV_FILE}
    environment:
      NODE_ENV: development
      MARKFIX_SERVICE_MODE: production
      PORT: 4310
      ARTIFACT_DIR: /data/artifacts
      MARKFIX_EXPOSE_AUTH_TOKENS: 'false'
      MARKFIX_ALLOW_SELF_SERVICE_PLAN_UPGRADE: 'false'
    volumes:
      - artifact-data:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4310/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20

  dashboard:
    image: ${DASHBOARD_IMAGE:?Set DASHBOARD_IMAGE}
    restart: unless-stopped
    ports:
      - '8766:80'
    volumes:
      - ./api-proxy.conf:/etc/nginx/markfix/api-proxy.conf:ro
      - ./downloads.conf:/etc/nginx/markfix/downloads.conf:ro
      - ${MARKFIX_DOWNLOAD_ROOT:?Set MARKFIX_DOWNLOAD_ROOT}:/srv/markfix-downloads:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1/v1/health >/dev/null && wget -qO- http://127.0.0.1/ >/dev/null',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  artifact-data:
