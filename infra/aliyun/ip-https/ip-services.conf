# Public IP endpoints for MarkFix and DoTasks. ACME uses port 80.
map $http_upgrade $ip_services_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name 121.40.211.86;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name 121.40.211.86;
    ssl_certificate /etc/letsencrypt/live/121.40.211.86/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/121.40.211.86/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;
    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_cookie_flags markfix_access secure;
        proxy_cookie_flags markfix_refresh secure;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ip_services_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
server {
    listen 8443 ssl;
    server_name 121.40.211.86;
    ssl_certificate /etc/letsencrypt/live/121.40.211.86/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/121.40.211.86/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ip_services_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
