name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markfix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @markfix/database db:generate
      - run: python3 infra/aliyun/test_deploy.py
      - run: python3 infra/aliyun/test_publish_desktop.py
      - run: python3 infra/aliyun/test_publish_images.py
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build API image archive
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile.api
          platforms: linux/amd64
          push: false
          # Export Docker archives; the target runner pushes to ACR locally.
          provenance: false
          outputs: type=docker,dest=${{ runner.temp }}/markfix-api.tar
          tags: crpi-c94ukgtq3wrezdx5.cn-hangzhou.personal.cr.aliyuncs.com/markfix/markfix-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build dashboard image archive
        id: dashboard
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile.dashboard
          platforms: linux/amd64
          push: false
          # Export Docker archives; the target runner pushes to ACR locally.
          provenance: false
          outputs: type=docker,dest=${{ runner.temp }}/markfix-dashboard.tar
          tags: crpi-c94ukgtq3wrezdx5.cn-hangzhou.personal.cr.aliyuncs.com/markfix/markfix-dashboard:${{ github.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: markfix-images-${{ github.sha }}
          path: |
            ${{ runner.temp }}/markfix-api.tar
            ${{ runner.temp }}/markfix-dashboard.tar
          compression-level: 1
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: markfix-deployment-${{ github.sha }}
          path: infra/aliyun/
          if-no-files-found: error
          retention-days: 7

  registry:
    needs: publish
    runs-on: [self-hosted, Linux, X64, markfix-preview]
    environment: aliyun-preview
    timeout-minutes: 30
    permissions:
      actions: read
    outputs:
      api_image: ${{ steps.images.outputs.api_image }}
      dashboard_image: ${{ steps.images.outputs.dashboard_image }}
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: markfix-images-${{ github.sha }}
          path: ${{ runner.temp }}/markfix-images-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: markfix-deployment-${{ github.sha }}
          path: ${{ runner.temp }}/markfix-registry-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Isolate registry credentials
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/markfix-registry-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: crpi-c94ukgtq3wrezdx5.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Load images and publish immutable ACR digests
        id: images
        env:
          IMAGE_ARCHIVE_DIR: ${{ runner.temp }}/markfix-images-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash "$RUNNER_TEMP/markfix-registry-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/publish_images.sh"
      - name: Remove transferred archives
        if: always()
        run: rm -f "$RUNNER_TEMP/markfix-images-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/markfix-api.tar" "$RUNNER_TEMP/markfix-images-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/markfix-dashboard.tar"

  deploy:
    needs: registry
    runs-on: [self-hosted, Linux, X64, markfix-preview]
    environment: aliyun-preview
    # Allow slow first-time image pulls on the preview server.
    timeout-minutes: 120
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: markfix-deployment-${{ github.sha }}
          path: ${{ runner.temp }}/markfix-deployment-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Isolate registry credentials from other applications
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/markfix-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: crpi-c94ukgtq3wrezdx5.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Deploy and check HTTP preview
        env:
          API_IMAGE: ${{ needs.registry.outputs.api_image }}
          DASHBOARD_IMAGE: ${{ needs.registry.outputs.dashboard_image }}
        run: bash "$RUNNER_TEMP/markfix-deployment-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/deploy.sh"
