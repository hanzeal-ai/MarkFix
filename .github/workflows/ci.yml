name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_desktop:
        description: Build and publish a signed macOS Apple Silicon release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: markfix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @markfix/database db:generate
      - run: python3 infra/aliyun/test_deploy.py
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  release-desktop:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.release_desktop
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - name: Validate release configuration and new version
        run: |
          set -euo pipefail
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing release configuration: $key"
              exit 1
            fi
          done
          node apps/desktop/scripts/check-update-release.mjs
          version=$(node -p 'JSON.parse(require("fs").readFileSync("apps/desktop/package.json", "utf8")).version')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Desktop releases require a stable major.minor.patch version.'
            exit 1
          fi
          tag="desktop-v$version"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Release tag $tag already exists. Published packages must not be overwritten."
            exit 1
          fi
          echo "DESKTOP_VERSION=$version" >> "$GITHUB_ENV"
          echo "DESKTOP_TAG=$tag" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @markfix/database db:generate
      - name: Build signed and notarized DMG and ZIP
        run: >-
          pnpm --filter @markfix/desktop package:mac:release --arm64
          --config.directories.output=release
          '--config.artifactName=MarkFix-${version}-${arch}.${ext}'
      - name: Verify packaged application and checksums
        run: |
          set -euo pipefail
          packaged_app='apps/desktop/release/mac-arm64/MarkFix.app'
          codesign --verify --deep --strict --verbose=2 "$packaged_app"
          spctl --assess --type execute --verbose=2 "$packaged_app"
          xcrun stapler validate "$packaged_app"
          actual_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$packaged_app/Contents/Info.plist")
          test "$actual_version" = "$DESKTOP_VERSION"
          cd apps/desktop/release
          test -s "MarkFix-$DESKTOP_VERSION-arm64.dmg"
          test -s "MarkFix-$DESKTOP_VERSION-arm64.zip"
          hdiutil verify "MarkFix-$DESKTOP_VERSION-arm64.dmg"
          unzip -tq "MarkFix-$DESKTOP_VERSION-arm64.zip"
          shasum -a 256 "MarkFix-$DESKTOP_VERSION-arm64.dmg" "MarkFix-$DESKTOP_VERSION-arm64.zip" > SHA256SUMS.txt
      - name: Upload packages and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$DESKTOP_TAG" \
            "apps/desktop/release/MarkFix-$DESKTOP_VERSION-arm64.dmg" \
            "apps/desktop/release/MarkFix-$DESKTOP_VERSION-arm64.zip" \
            apps/desktop/release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "MarkFix $DESKTOP_VERSION · macOS Apple Silicon" \
            --notes-file docs/github-desktop-release-notes.md --draft
          gh release edit "$DESKTOP_TAG" --draft=false

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      api_image: crpi-c94ukgtq3wrezdx5.cn-hangzhou.personal.cr.aliyuncs.com/markfix/markfix-api@${{ steps.api.outputs.digest }}
      dashboard_image: crpi-c94ukgtq3wrezdx5.cn-hangzhou.personal.cr.aliyuncs.com/markfix/markfix-dashboard@${{ steps.dashboard.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: crpi-c94ukgtq3wrezdx5.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and publish API
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile.api
          platforms: linux/amd64
          push: true
          # ACR personal edition rejects Buildx provenance attestations.
          provenance: false
          tags: crpi-c94ukgtq3wrezdx5.cn-hangzhou.personal.cr.aliyuncs.com/markfix/markfix-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and publish dashboard
        id: dashboard
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile.dashboard
          platforms: linux/amd64
          push: true
          # ACR personal edition rejects Buildx provenance attestations.
          provenance: false
          tags: crpi-c94ukgtq3wrezdx5.cn-hangzhou.personal.cr.aliyuncs.com/markfix/markfix-dashboard:${{ github.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: markfix-deployment-${{ github.sha }}
          path: infra/aliyun/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: publish
    runs-on: [self-hosted, Linux, X64, markfix-preview]
    environment: aliyun-preview
    # Allow slow first-time image pulls on the preview server.
    timeout-minutes: 120
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: markfix-deployment-${{ github.sha }}
          path: ${{ runner.temp }}/markfix-deployment-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Isolate registry credentials from other applications
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/markfix-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: crpi-c94ukgtq3wrezdx5.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Deploy and check HTTP preview
        env:
          API_IMAGE: ${{ needs.publish.outputs.api_image }}
          DASHBOARD_IMAGE: ${{ needs.publish.outputs.dashboard_image }}
        run: bash "$RUNNER_TEMP/markfix-deployment-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/deploy.sh"
