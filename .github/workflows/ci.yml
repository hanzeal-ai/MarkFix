name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markfix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @markfix/database db:generate
      - run: python3 infra/aliyun/test_receiver.py
      - run: python3 infra/aliyun/test_deploy.py
      - run: python3 infra/aliyun/test_publish_desktop.py
      - run: python3 infra/aliyun/test_publish_images.py
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build API image archive
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile.api
          platforms: linux/amd64
          push: false
          # Transfer images directly to the restricted SSH receiver.
          provenance: false
          outputs: type=docker,dest=${{ runner.temp }}/markfix-api.tar
          tags: markfix-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build dashboard image archive
        id: dashboard
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile.dashboard
          platforms: linux/amd64
          push: false
          # Transfer images directly to the restricted SSH receiver.
          provenance: false
          outputs: type=docker,dest=${{ runner.temp }}/markfix-dashboard.tar
          tags: markfix-dashboard:${{ github.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
      - name: Package verified images
        run: python3 infra/aliyun/package.py "$GITHUB_SHA" "$RUNNER_TEMP/markfix-release.zip" "api=$RUNNER_TEMP/markfix-api.tar" "dashboard=$RUNNER_TEMP/markfix-dashboard.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: markfix-release-${{ github.sha }}
          path: ${{ runner.temp }}/markfix-release.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

  deploy:
    concurrency:
      group: markfix-production-deploy
      cancel-in-progress: false
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: aliyun-preview
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: markfix-release-${{ github.sha }}
          path: ${{ runner.temp }}/markfix-release
      - name: Deploy through restricted SSH receiver
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash infra/aliyun/send.sh site "$GITHUB_SHA" "$RUNNER_TEMP/markfix-release/markfix-release.zip"
